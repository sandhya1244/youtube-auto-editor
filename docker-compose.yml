services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_editor}
      POSTGRES_USER: ${POSTGRES_USER:-video_editor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_editor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://video_editor:video_editor@db:5432/video_editor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      ENABLE_TRANSCRIPTION: ${ENABLE_TRANSCRIPTION:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      GOOGLE_CLIENT_SECRETS: /app/data/tokens/client_secret.json
      GOOGLE_TOKEN_FILE: /app/data/tokens/youtube_token.json
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:8000/api/youtube/callback}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://video_editor:video_editor@db:5432/video_editor}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATA_DIR: /app/data
      ENABLE_TRANSCRIPTION: ${ENABLE_TRANSCRIPTION:-false}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      GOOGLE_CLIENT_SECRETS: /app/data/tokens/client_secret.json
      GOOGLE_TOKEN_FILE: /app/data/tokens/youtube_token.json
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:8000/api/youtube/callback}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
